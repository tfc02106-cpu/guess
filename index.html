<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>監控影像強化與特徵凸顯工具</title>
<style>
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #1e1e1e;
        color: #f0f0f0;
        margin: 0;
        padding: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    h2 {
        color: #61dafb;
        margin-bottom: 5px;
    }
    p.desc {
        color: #aaaaaa;
        font-size: 14px;
        margin-bottom: 20px;
    }
    .main-container {
        display: flex;
        flex-direction: column;
        width: 100%;
        max-width: 800px;
        background: #2d2d2d;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 8px 16px rgba(0,0,0,0.5);
    }
    .upload-section {
        margin-bottom: 20px;
        padding: 15px;
        background: #3d3d3d;
        border-radius: 8px;
        text-align: center;
        border: 2px dashed #555;
    }
    .upload-section input[type="file"] {
        display: none;
    }
    .upload-btn {
        background-color: #61dafb;
        color: #1e1e1e;
        padding: 10px 20px;
        border-radius: 6px;
        cursor: pointer;
        font-weight: bold;
        transition: background-color 0.2s;
    }
    .upload-btn:hover {
        background-color: #4fa8c7;
    }
    .canvas-container {
        width: 100%;
        display: flex;
        justify-content: center;
        background: #000;
        border-radius: 8px;
        overflow: hidden;
        margin-bottom: 20px;
        min-height: 200px;
        border: 1px solid #444;
    }
    canvas {
        max-width: 100%;
        object-fit: contain;
    }
    .controls-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 15px;
    }
    .control-group {
        background: #3a3a3a;
        padding: 15px;
        border-radius: 8px;
    }
    .control-header {
        display: flex;
        justify-content: space-between;
        margin-bottom: 10px;
        font-size: 14px;
        font-weight: bold;
    }
    .val-display {
        color: #61dafb;
    }
    input[type=range] {
        width: 100%;
        accent-color: #61dafb;
    }
    .help-text {
        font-size: 12px;
        color: #999;
        margin-top: 5px;
    }
    .btn-reset {
        margin-top: 20px;
        padding: 12px;
        background-color: #e06c75;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-weight: bold;
        font-size: 16px;
    }
    .btn-reset:hover {
        background-color: #c55b63;
    }
</style>
</head>
<body>

    <h2>監控影像強化工具</h2>
    <p class="desc">針對夜間或低光源監視器畫面設計的五段式畫素級調整工具</p>

    <div class="main-container">
        <div class="upload-section">
            <label for="upload" class="upload-btn">選擇影像檔案</label>
            <input type="file" id="upload" accept="image/*">
            <p style="font-size: 12px; margin-top: 10px; color: #888;">請上傳您的圖片</p>
        </div>

        <div class="canvas-container">
            <canvas id="canvas"></canvas>
        </div>

        <div class="controls-grid">
            <!-- 1. 基礎亮度 -->
            <div class="control-group">
                <div class="control-header">
                    <span>1. 線性亮度 (Brightness)</span>
                    <span class="val-display" id="val-brightness">0</span>
                </div>
                <input type="range" id="brightness" min="-150" max="150" value="0">
                <div class="help-text">整體提升或降低亮度</div>
            </div>

            <!-- 2. 線性對比 -->
            <div class="control-group">
                <div class="control-header">
                    <span>2. 線性對比 (Contrast)</span>
                    <span class="val-display" id="val-contrast">0</span>
                </div>
                <input type="range" id="contrast" min="-100" max="150" value="0">
                <div class="help-text">調整明暗差距</div>
            </div>

            <!-- 3. Gamma 校正 -->
            <div class="control-group">
                <div class="control-header">
                    <span>3. 伽瑪校正 (Gamma)</span>
                    <span class="val-display" id="val-gamma">1.00</span>
                </div>
                <input type="range" id="gamma" min="0.1" max="4.0" step="0.05" value="1.0">
                <div class="help-text">非線性調整，小於1可提亮暗部</div>
            </div>

            <!-- 4. 曝光度 -->
            <div class="control-group">
                <div class="control-header">
                    <span>4. 曝光 (Exposure)</span>
                    <span class="val-display" id="val-exposure">1.00</span>
                </div>
                <input type="range" id="exposure" min="0.1" max="5.0" step="0.1" value="1.0">
                <div class="help-text">倍數放大亮度訊號</div>
            </div>

            <!-- 5. 反相/負片 -->
            <div class="control-group">
                <div class="control-header">
                    <span>5. 反相/負片 (Invert)</span>
                    <span class="val-display" id="val-invert">0%</span>
                </div>
                <input type="range" id="invert" min="0" max="100" value="0">
                <div class="help-text">轉為負片觀察輪廓</div>
            </div>
        </div>

        <button class="btn-reset" id="reset">重置所有數值</button>
    </div>

    <script>
        // 確保 DOM 載入後才執行
        document.addEventListener('DOMContentLoaded', function() {
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            let img = new Image();
            let originalImageData = null;

            // 處理圖片上傳
            const uploadInput = document.getElementById('upload');
            if (uploadInput) {
                uploadInput.addEventListener('change', function(e){
                    const file = e.target.files[0];
                    if(!file) return;
                    const reader = new FileReader();
                    reader.onload = function(event){
                        img.onload = function(){
                            const maxDim = 1200;
                            let w = img.width;
                            let h = img.height;
                            if (w > maxDim || h > maxDim) {
                                const ratio = Math.min(maxDim/w, maxDim/h);
                                w = Math.floor(w * ratio);
                                h = Math.floor(h * ratio);
                            }
                            canvas.width = w;
                            canvas.height = h;
                            ctx.drawImage(img, 0, 0, w, h);
                            originalImageData = ctx.getImageData(0, 0, w, h);
                            applyFilters();
                        }
                        img.src = event.target.result;
                    }
                    reader.readAsDataURL(file);
                });
            }

            // 綁定五種滑桿的事件
            const inputs = ['brightness', 'contrast', 'gamma', 'exposure', 'invert'];
            inputs.forEach(id => {
                const el = document.getElementById(id);
                if (el) {
                    el.addEventListener('input', function() {
                        let displayVal = this.value;
                        if (id === 'gamma' || id === 'exposure') displayVal = parseFloat(this.value).toFixed(2);
                        if (id === 'invert') displayVal = this.value + '%';
                        
                        document.getElementById('val-' + id).innerText = displayVal;
                        
                        // 確保 applyFilters 被呼叫
                        requestAnimationFrame(applyFilters);
                    });
                }
            });

            // 重置按鈕
            const resetBtn = document.getElementById('reset');
            if (resetBtn) {
                resetBtn.addEventListener('click', () => {
                    document.getElementById('brightness').value = 0; document.getElementById('val-brightness').innerText = '0';
                    document.getElementById('contrast').value = 0; document.getElementById('val-contrast').innerText = '0';
                    document.getElementById('gamma').value = 1.0; document.getElementById('val-gamma').innerText = '1.00';
                    document.getElementById('exposure').value = 1.0; document.getElementById('val-exposure').innerText = '1.00';
                    document.getElementById('invert').value = 0; document.getElementById('val-invert').innerText = '0%';
                    applyFilters();
                });
            }

            // 核心影像處理
            function applyFilters() {
                if(!originalImageData) return;
                
                const b = parseInt(document.getElementById('brightness').value) || 0;
                const c = parseInt(document.getElementById('contrast').value) || 0;
                const g = parseFloat(document.getElementById('gamma').value) || 1.0;
                const e = parseFloat(document.getElementById('exposure').value) || 1.0;
                const inv = (parseInt(document.getElementById('invert').value) || 0) / 100;

                const contrastFactor = (259 * (c + 255)) / (255 * (259 - c));
                const gammaCorrection = 1 / g;

                const imageData = new ImageData(
                    new Uint8ClampedArray(originalImageData.data),
                    originalImageData.width,
                    originalImageData.height
                );
                const data = imageData.data;

                for (let i = 0; i < data.length; i += 4) {
                    for (let j = 0; j < 3; j++) {
                        let val = data[i+j];
                        
                        val = val * e;
                        val = contrastFactor * (val - 128) + 128;
                        val = val + b;
                        
                        val = Math.max(0, Math.min(255, val));
                        val = 255 * Math.pow(val / 255, gammaCorrection);
                        
                        if (inv > 0) {
                            val = val * (1 - inv) + (255 - val) * inv;
                        }

                        data[i+j] = val;
                    }
                }
                
                ctx.putImageData(imageData, 0, 0);
            }
        });
    </script>
</body>
</html>
